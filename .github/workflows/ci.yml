name: ci

# EVERY JOB IS SETUP PLUS ONE `tools/verify.sh --only <slices>` CALL. This file says
# WHERE a slice runs - which runner, which shard, which tier - and tools/verify.sh
# says WHAT it runs; `sh tools/verify.sh --list` prints every slice and its steps.
# The gate set used to be written here as inline shell as well, and a second copy of
# it is how a check came to run in CI and nowhere a developer could run it.
# tools/gate-parity.py holds this file to the runner's list: every slice a job names
# must be listed, every per-run slice must have a job outside the release tier, and
# a sharded slice's matrix must run every part on every runner.
#
# A RED JOB IS STILL A COMPLETE LIST, without a per-step guard: verify.sh runs every
# step of its slices whatever an earlier one did, and its summary names every red.
on:
  push:
    branches: [main]
  pull_request:
  # A push is the only thing that used to create a run, which means a commit whose
  # run was never created had no way to ever get one. This makes the run
  # addressable by ref:
  #     gh workflow run ci.yml --ref main
  # The drive's CI cadence and `tools/release.py ci <ref>` dispatch with `--ref`
  # alone, so the default tier is the one every run that is not a release gets;
  # `tools/release.py` passes `-f tier=release` for a release candidate.
  workflow_dispatch:
    inputs:
      tier:
        description: "per-run (every per-run gate, the code-page leg over its selection) or release (adds the Windows re-sample and the whole code-page leg)"
        type: choice
        default: per-run
        options:
          - per-run
          - release

permissions:
  contents: read
  # tools/ci-verified.py lists this workflow's runs and their jobs.
  actions: read

# On any ref but main a newer run cancels an older one, running or queued. On main
# (`cancel-in-progress` is false there) a RUNNING run is never cancelled, but the group
# `ci-refs/heads/main` holds one running and one pending run, so a run still queued when
# a newer push to main queues behind it is replaced and never runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# EVERY JOB CARRIES timeout-minutes, and tools/gate-parity.py fails the build on a job
# that does not (`untimed_jobs`). GitHub's own default is six hours, and the
# 2026-10-09 ubuntu run spent all six of them on a screenshot check that had stopped
# printing, then reported "cancelled" rather than naming a step.
#
# Each bound is two to three times the longest FINISHED run of that job - success or
# failure; a cancelled job measures the cancel, not the job - and a job whose three
# times is under five minutes may sit at five: a sub-minute measurement samples none
# of the runner provisioning and install variance its bound still has to cover.
# A job that runs the sweep may instead be held up by the sweep's deadline: one
# `# bound <job>: held by the sweep deadline (...)` line lets its bound reach the
# smallest whole minute that tools/sweep-selftests.py's SWEEP_DEADLINE plus
# CI_SETUP_ALLOWANCE fits strictly inside, both read out of that file, and only
# when verify.sh --list says the job's slices sweep the tree.
# gate-parity.py (`job_bound_evidence`) fails the build when a job has no `longest`
# line or its bound is outside that range. Re-derive a figure with
#   gh run view <id> --json jobs --jq '.jobs[] | [.name, .conclusion, .startedAt, .completedAt]'
# and rewrite its line when a job grows.
#
# The selftests job's figure is measured, on the shape it has now. Its history: run
# 38379717433 (ci/p127 at 544576f) took 9m18s at most in a cell, run 38929591548
# 14m43s, and run 40715565769 (f06f113f) 23m43s, in the cell whose part held
# tests/test_drive_phase.py alone, because a part then held whole files. The parts
# now deal a staged suite's blocks (tools/sweep-selftests.py `shard_units`). The
# windows plain leg runs five parts and the code-page leg three (the matrix's
# `parts` rows); the `longest` line below is the longest cell of the per-run run
# 41158896864 (head ef0ec287), `selftests (windows, plain 4)`. The bound does not
# follow the parts down: the sweep's deadline must fit inside it
# (tools/sweep-selftests.py `SWEEP_DEADLINE`, case tt5), and the deadline in turn
# sits above the heaviest block's calibrated timeout, which no part count changes.
# So the job declares its bound held by that deadline (the `bound selftests` line
# below), and a measured run three times would not reach still passes. A lighter
# heaviest block is what lets the deadline and the bound come down.
# `--shard I/N` prints every part's load, so an estimate re-derives from the line
# it prints.
#
# THE OTHER JOBS ARE NEW SHAPES, and their figures are ESTIMATES built from the steps
# each now runs, as those steps were measured in runs 38902667892 and 38929591548
# (ci/p125, every job green); each is replaced by the first measured run of its job:
#   e2e      - that run's windows e2e cell, whose steps it runs (run 38902667892)
#   lint     - measured: the merged job's first run took 3m14s (run 41112221437), past
#              the 2m38s its estimate had set (the lint + e2e job's 1m50s plus the
#              manifests job's verify, node and install steps), so the bound moved
#              to 7, over twice the measurement
#   browser-panel / browser-report - the screenshot step, and the two interactive
#              steps, of that run's manifest job, plus its node setup (run 38929591548)
#   verified - checkout, setup-python and two API reads (no run yet)
# The resample figure is measured: its first finished run, run 40715565769 (f06f113f,
# success), took 22m00s, past half the bound of 40 its estimate had set, so the bound
# moved to twice the measurement.
#   longest selftests: 7m48s (run 41158896864, windows plain 4, 02:12:07 to 02:19:55)
#   bound selftests: held by the sweep deadline (tools/sweep-selftests.py SWEEP_DEADLINE)
#   longest e2e: 1m41s (estimate, run 38902667892)
#   longest lint: 3m14s (run 41112221437, 19:04:54 to 19:08:08)
#   longest browser-panel: 6m24s (estimate, run 38929591548)
#   longest browser-report: 7m19s (estimate, run 38929591548)
#   longest verified: 0m30s (estimate, no run yet)
#   longest resample: 22m00s (run 40715565769, windows-2025)
# EVERY JOB PINS ITS RUNNER IMAGE, and so does every `os` value a matrix crosses. A
# `*-latest` label is a pointer GitHub moves: `ubuntu-latest` went from ubuntu-24.04
# to ubuntu-26.04 between two runs, and the new image could not install the browser
# the lockfile pins nor offer the interpreter the lint job asks for. The images
# pinned are ubuntu-24.04 for Linux and windows-2025 for Windows. Moving to a newer
# image is an edit to this file, made on purpose and seen in a diff. No job's display
# name carries the image - a check is named by its family (`windows`, `linux`) - so
# that edit renames no check a branch-protection rule may be waiting on.
# tools/gate-parity.py reports a `-latest` runs-on or matrix value, and an image in a
# job's display name, by job name (`floating_runners()`, `image_in_job_names()`).
jobs:
  # HAS THIS EXACT COMMIT ALREADY PASSED THIS WORKFLOW? Asked on a push to main only:
  # a phase reaches main as a commit its ci/ branch dispatch already ran, and running
  # the same bytes again could only add a Windows intermittent the first draw did not
  # have. tools/ci-verified.py names the run that verified the commit, and every other
  # job here is skipped. It refuses a run whose jobs were skipped - a skipped job
  # reports success to GitHub - so a run this job skipped never vouches for the next;
  # this job's own and the release-tier job may be skipped by design (`--exempt-job`).
  # Could-not-ask leaves the output empty, and every job runs.
  verified:
    name: verified
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.ask.outputs.verified }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: ask
        name: Ask whether a run of this workflow already verified this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/ci-verified.py --repo "$GITHUB_REPOSITORY"
          --workflow ci.yml --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --exempt-job verified --exempt-job resample --output "$GITHUB_OUTPUT"

  # ONE CELL PER SWEEP SLICE AND SHARD, all at once. Each sweep slice is split into
  # its runner family's `parts` (the matrix's `include` rows) by `--shard`; the
  # windows legs, the critical path, get the most parts the concurrent-job cap leaves
  # room for, and the linux legs the fewest that still finish before them (the lint
  # job's comment below says what the cap is). `--shard` deals files AND a
  # staged suite's blocks, balanced by the
  # per-file and per-block costs in .github/sweep-costs.json; the parts' union is the
  # whole tree, block by block (the runner's sh0 and sd cases), and each part replays
  # the blocks it ran, naming the others as run elsewhere. A case id two blocks of one
  # suite write is read off the suite's source by every replay (tests/_harness.py
  # `cross_block_ids`, cases sr3c and sr21), so each part checks it whichever blocks it
  # was dealt; no job reads a part's run against another's. Inside a cell the sweep uses
  # every core, because it reads `CI=true`, as ONE budget of slots, which schedules a
  # staged suite's blocks one slot each - the model is stated once, in the `blocks,
  # not suites` comment above work_items() in tools/sweep-selftests.py. Each file's
  # and each block's timeout is calibrated from its own cost, and the sweep cuts every
  # timeout to its CI deadline, so a hung file is named before this job's bound
  # cancels it with nothing named. Re-record the table from the windows cells' logs,
  # the platform that binds; every cell's log prints its blocks' seconds, so take all
  # of them. `--platform` names the image the cells ran on and `--workers` the slots
  # each cell's `budget:` line printed; without `--workers` the table records none.
  # `gh run view --log` refuses while any job of the run is still going (the release
  # tier's resample job outlasts the cells), and the API hands out a finished job's log:
  #   gh api repos/<owner>/<repo>/actions/jobs/<windows cell>/logs > <saved log>
  #   python tools/sweep-selftests.py --costs-from-log <saved logs, concatenated> \
  #       --platform windows-2025 --workers <slots> --record-costs .github/sweep-costs.json
  #
  # `selftests-stress` asks a legacy code page AND a spaced, linked TMPDIR in one
  # execution, posix only: symlinks need a privilege the Windows runner does not grant,
  # and the runner refuses `--spaced` there rather than skip silently. Windows runs the
  # code-page leg alone, until the Windows intermittents are shown absent from its
  # plain cells; that deletion waits on that evidence. Per run that leg is
  # `selftests-cp1252`, the suites the pass is about, and on the release tier
  # `selftests-cp1252-whole` (the `cp1252` include row below says how).
  #
  # A cell is NAMED by its leg (`selftests (<family>, <leg> <shard>)`), which is the shape
  # the CI study's readers parse a run's cells by; each `include` row below adds the
  # slice to every cell of its leg, since it overwrites no value the matrix lists.
  selftests:
    name: selftests (${{ startsWith(matrix.os, 'windows') && 'windows' || 'linux' }}, ${{ matrix.leg }} ${{ matrix.shard }})
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    timeout-minutes: 33
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        leg: [plain, stress, cp1252]
        shard: [1, 2, 3, 4, 5]
        exclude:
          - os: windows-2025
            leg: stress
          - os: ubuntu-24.04
            leg: cp1252
          # The linux legs run the parts their `parts` row below names, and no more.
          - os: ubuntu-24.04
            shard: 3
          - os: ubuntu-24.04
            shard: 4
          - os: ubuntu-24.04
            shard: 5
          # ...and so does the windows code-page leg.
          - os: windows-2025
            leg: cp1252
            shard: 4
          - os: windows-2025
            leg: cp1252
            shard: 5
        include:
          - leg: plain
            slice: selftests
          - leg: stress
            slice: selftests-stress
          # THE ONE SLICE THAT DEPENDS ON THE TIER. Per run the code-page leg sweeps
          # only the suites the pass is about (the runner derives them from what the
          # pass sets); a release-tier run sweeps the whole tree under it, in the
          # same cells. tools/gate-parity.py (`encoding_leg_drift`) reads both arms
          # and fails the build when the per-run arm runs the whole tree or no
          # release-tier windows cell runs it whole.
          - leg: cp1252
            slice: ${{ inputs.tier == 'release' && 'selftests-cp1252-whole' || 'selftests-cp1252' }}
          # EACH FAMILY'S PART COUNT, the N of `--shard I/N`. A row keyed by `os`
          # joins every cell of that runner, since it overwrites no value the matrix
          # lists; a later row keyed by `os` and `leg` may overwrite it for one leg.
          # The code-page leg's row is that: per run its selection splits into the
          # fewest parts that each carry less than a plain windows part (`--shard`
          # prints every part's load), so its cells end before the plain ones; the
          # whole tree on the release tier takes longer in the same cells - an
          # estimate, until a release-tier run of this shape is measured, puts
          # them inside the job's bound and inside the resample job's run.
          - os: ubuntu-24.04
            parts: 2
          - os: windows-2025
            parts: 5
          - os: windows-2025
            leg: cp1252
            parts: 3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # THE WHOLE HISTORY: tools/check-example-ledgers.py's el17 asks this
          # checkout whether it can answer for a commit's existence, and a shallow
          # clone answers "no" - correctly, which is a refusal and not a defect.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: verify slice
        shell: bash
        run: sh tools/verify.sh --only ${{ matrix.slice }} --shard ${{ matrix.shard }}/${{ matrix.parts }}

  # The runner's own cases and the launcher-driven checks, on Windows, where threads,
  # subprocesses, a forced codec and an MSYS path all behave differently. The ubuntu
  # half of the same slices rides in the lint job, which shares its setup.
  e2e:
    name: e2e (windows)
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    timeout-minutes: 5
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: verify slices
        shell: bash
        run: sh tools/verify.sh --only runner,e2e

  # THE STATIC CHECKS ARE ONE JOB - lint, the runner's cases, e2e, and the manifests,
  # js and plugin slices - because GitHub runs at most twenty of this account's jobs
  # at once and holds the rest until a running job finishes. Measured, not documented:
  # in each release-tier run from 40761628365 to 41070108164 (twenty-two jobs each)
  # exactly two jobs started late, each one to four seconds after the first and the
  # second job to finish, and in six of those seven runs a held job was a Windows
  # sweep cell, the critical path, so its wait landed on the run's wall. Re-derive
  # it from any run with
  #   gh run view <id> --json jobs --jq '.jobs[] | [.name, .startedAt, .completedAt]'
  # The sweep cells are what the rest of the cap pays for: the windows legs take the
  # most parts the cap leaves room for, because a windows cell is the critical path,
  # and the linux legs the fewest whose cells still end before the windows ones. A
  # per-run run asks for the selftests matrix's cells plus e2e, this job and the two
  # browser jobs; `verified` ends before any of them starts, since they all need it.
  # The parts are chosen to leave room under the cap for the release tier's resample
  # job too, so none should be held - a prediction until a run of this shape is
  # measured. A job added to this
  # file (a slice split into its own job, a new leg or shard) is held behind the cap
  # unless another merges or a family's `parts` drops. tools/gate-parity.py counts
  # the jobs each tier's run starts at once - matrix cells after exclude and include,
  # `verified` left out since every other job needs it - and fails the build on a
  # tier over its JOB_CAP (`job_cap_drift()`); `python3 tools/gate-parity.py
  # --selftest` prints both tiers' counts in case jc0. It counts one run: the cap is
  # the account's, so two runs at once still share it.
  lint:
    name: lint + manifests + e2e (linux)
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    timeout-minutes: 7
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # THE WHOLE HISTORY: check-example-ledgers.py asks git whether the commits
          # the committed manifests name are really here, and refuses on a clone that
          # cannot answer rather than passing quietly.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          # MORE THAN ONE, for the hook import budget: a stdlib import graph is not
          # the same on every version, and this plugin publishes support for 3.8 and
          # up. The LAST version listed is what bare `python` resolves to; the others
          # are reachable as `python3.<minor>`, which is what bench-hooks.py looks for,
          # and a version this action stops providing is REPORTED by that command as
          # unmeasured rather than silently dropped.
          python-version: |
            3.9
            3.11
            3.12
      - name: Install pinned lint tools (dev/CI-only, not a runtime dependency)
        run: pip install ruff==0.16.2 vermin==1.8.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install the JavaScript dev dependencies and the Claude Code CLI
        run: |
          npm ci
          npm install -g @anthropic-ai/claude-code
      - name: verify slices
        shell: bash
        run: sh tools/verify.sh --only lint,runner,e2e,manifests,js,plugin

  # The two browser gates are two jobs, so neither waits for the other. One install
  # and one pin: playwright is a devDependency that `npm ci` installs from the
  # lockfile, and only the browser binaries are fetched beside it.
  browser-panel:
    name: browser (panel)
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install the JavaScript dev dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: verify slice
        shell: bash
        run: sh tools/verify.sh --only panel

  browser-report:
    name: browser (report)
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install the JavaScript dev dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: verify slice
        shell: bash
        run: sh tools/verify.sh --only report

  # RELEASE TIER ONLY: the Windows intermittents drawn on purpose, at the rates
  # verify.sh's RESAMPLE table gives them. A red draw on a green SHA is a finding for
  # /audit:bug; nothing files it automatically yet.
  resample:
    name: resample (windows)
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.run == '' && inputs.tier == 'release' }}
    timeout-minutes: 44
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: verify slice
        shell: bash
        run: sh tools/verify.sh --only resample
