name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A push is the only thing that used to create a run, which means a commit whose
  # run was never created had no way to ever get one. During the 2026-08-06 Actions
  # outage six commits landed on main with zero runs between them; the only ways to
  # verify the tip were an empty commit (which changes the sha you would tag) or a
  # throwaway PR (whose run is on a merge ref, not on main). Neither verifies the
  # thing being released. This makes the run addressable by ref:
  #     gh workflow run ci.yml --ref main
  workflow_dispatch:

jobs:
  selftests:
    name: selftests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Hook + validator selftests (stdlib only)
        shell: bash
        run: |
          set -e
          # Globbed, not enumerated. The hand-maintained list had drifted three ways
          # — 19 files here, 10 in CONTRIBUTING.md, 14 in PLUGIN-BUILD-GUIDE.md — and
          # the drift was not only cosmetic: gen-demo-usage.py's 19 cases were never
          # run by CI at all, because adding a file and adding a line here are two
          # separate acts and only one of them is enforced.
          #
          # Every .py under hooks/ and scripts/ MUST carry a --selftest. A new file
          # without one now fails this step rather than being silently skipped, which
          # is the failure mode a list can never catch.
          #
          # RECURSIVE, not `*.py`. The glob was flat, and that is the only reason
          # CONTRIBUTING.md had to carry a rule forbidding subdirectories: a file one
          # level down stopped being run here without anything going red. `find`
          # removes the hazard instead of forbidding the shape. It is a no-op on a
          # flat tree, so this changes nothing today and everything the day somebody
          # adds a script one directory down.
          #
          # tests/ IS SWEPT HERE TOO, and a MIGRATED production file is skipped. The
          # --selftest blocks are moving out of the modules they test into
          # plugins/audit/tests/, one file at a time, so during the migration a
          # production file either prints the contract itself or has a test file that
          # does. The skip list comes from _output.selftest_coverage() rather than
          # from a name transform re-implemented in shell: that same function is what
          # fails the build on a file with NEITHER suite, so this loop cannot skip a
          # file nobody is testing. A migrated file still exits 0 on --selftest and
          # says where its cases went; it just does not print `N/M cases passed`.
          # `tr` because the membership test below is a space-delimited glob and the
          # flag prints one path per line. Written without it first, and the skip
          # silently never fired: the loop reached a migrated file and failed it for
          # having no suite, which is the LOUD way for this to be wrong and the reason
          # it was caught in the first local run.
          # `tr -d '\r'` FIRST, and it is load-bearing on the Windows leg. `print()`
          # writes CRLF there, so `tr '\n' ' '` alone leaves a `\r` glued to every
          # path and the `case` below matches nothing — every migrated file gets run,
          # finds a pointer where the contract should be, and the sweep dies on the
          # first one. That is how 44c4971 went green on ubuntu and red on windows.
          # It fails LOUD in this direction, which is the only reason it was cheap:
          # a stray `\r` can never make a path match something it should not.
          covered=$(python plugins/audit/scripts/_output.py --covered | tr -d '\r' | tr '\n' ' ')
          echo "migrated to tests/ (no inline suite expected): ${covered:-(none yet)}"
          total=0
          for f in $(find plugins/audit/hooks plugins/audit/scripts -name '*.py' | sort) \
                   $(find plugins/audit/tests -name '*.py' | sort); do
            echo "== $f"
            case " $covered " in
              *" $f "*)
                out=$(python "$f" --selftest 2>&1) || {
                  echo "$out"
                  echo "FAIL: $f --selftest exited non-zero"
                  exit 1
                }
                # Not redundant with the lint, and proven so: selftest_coverage()
                # reads STRING LITERALS, so it classifies a file that assembles the
                # contract line (`"0/0 cases " + "passed"`) as migrated while the
                # file still prints it. That is the proxy's one blind spot and this
                # is its net - shown red on purpose, with that exact mutation.
                if echo "$out" | grep -qE '[0-9]+/[0-9]+ cases passed'; then
                  echo "$out"
                  echo "FAIL: $f is listed as migrated but still prints the suite contract"
                  exit 1
                fi
                echo "   skipped: cases live in plugins/audit/tests/"
                continue
                ;;
            esac
            # Capture, but PRINT IN FULL on failure. The first version stored stdout
            # in a variable and echoed only the last line — so when the Windows leg
            # went red the log showed the filename, then "exit code 1", and nothing
            # else. A step that hides its output in exactly the case you need it is
            # worse than one that prints everything.
            if ! out=$(python "$f" --selftest 2>&1); then
              echo "$out"
              echo "FAIL: $f --selftest exited non-zero"
              exit 1
            fi
            echo "$out" | grep -qE '[0-9]+/[0-9]+ cases passed' || {
              echo "$out"
              echo "FAIL: $f has no --selftest (every hook/script must carry one)"
              exit 1
            }
            echo "$out" | tail -1
            n=$(echo "$out" | tail -1 | grep -oE '[0-9]+/[0-9]+' | cut -d/ -f1)
            total=$((total + n))
          done
          echo "== $total cases across $(find plugins/audit/hooks plugins/audit/scripts -name '*.py' | wc -l | tr -d ' ') production files + $(find plugins/audit/tests -name '*.py' | wc -l | tr -d ' ') test files"
      - name: ...and again on a stream that cannot spell every character
        shell: bash
        run: |
          set -e
          # A pipe on Windows is not UTF-8, it is the machine's legacy code page, and
          # Python does not drop a character it cannot encode - it raises. One selftest
          # case name contained a tick, so the Windows leg died on `print` with the run's
          # real result never computed, while every other OS stayed green. That is a
          # one-legged failure for a defect that has nothing to do with Windows.
          #
          # PYTHONIOENCODING reproduces it anywhere, so the class is now checked on BOTH
          # legs: scripts/ are guarded by _output.safe_stdio() (whose own selftest lints
          # that every entry point installs it), and hooks/ - which stay importless on
          # purpose - are covered by exactly this pass.
          #
          # tests/ is swept too, and NOTHING is skipped here. This pass asserts only
          # that a file can print whatever it prints on a legacy code page, which a
          # migrated file's one-line pointer has to survive exactly as much as a suite
          # does - so the skip the step above needs would only narrow this one.
          for f in $(find plugins/audit/hooks plugins/audit/scripts -name '*.py' | sort) \
                   $(find plugins/audit/tests -name '*.py' | sort); do
            if ! out=$(PYTHONIOENCODING=cp1252 python "$f" --selftest 2>&1); then
              echo "$out"
              echo "FAIL: $f cannot print its own output on a cp1252 stream"
              exit 1
            fi
          done
          echo "OK: every suite survives a stream that cannot spell every character"
      - name: Launcher resolves an interpreter (python3 -> python -> py)
        shell: bash
        run: |
          set -e
          # a Bash payload the guard allows: launcher must exec python and exit 0
          printf '{"tool_name":"Bash","tool_input":{"command":"ls"}}' \
            | sh plugins/audit/hooks/py-launch.sh guard-secrets-read.py ask
      - name: Launcher fails LOUD without any interpreter (ask JSON)
        shell: bash
        run: |
          set -e
          out=$(env PATH=/nonexistent "$(command -v sh)" plugins/audit/hooks/py-launch.sh guard-edits.py ask < /dev/null)
          echo "$out"
          echo "$out" | grep -q '"permissionDecision":"ask"'
      - name: Plan gate grades on evidence, end to end through the launcher
        shell: bash
        run: |
          set -e
          # Exercises all three tiers through py-launch.sh, because the selftests
          # call decide() directly and cannot prove the wiring: the launcher, the
          # stdin contract and the emitted JSON shape.
          #
          # The gate is graded, so the project dir must carry the right evidence for
          # each tier. Before 0.20.0 this step piped cwd=/tmp with no manifest and
          # asserted a deny; that combination is now deliberately an observe.
          big=$(python -c 'print("x\\n" * 120, end="")')
          proj=$(mktemp -d)
          mkdir -p "$proj/docs/audit"

          fire() {
            printf '{"tool_name":"Edit","tool_input":{"file_path":"src/x.ts","new_string":"%s"},"session_id":"ci-%s","cwd":"%s","hook_event_name":"PreToolUse"}' \
              "$big" "$1" "$proj" \
              | env CLAUDE_PROJECT_DIR="$proj" sh plugins/audit/hooks/py-launch.sh require-plan.py ask
          }

          # 1. no manifest -> observe: nothing is printed, so nothing is denied.
          out=$(fire observe)
          if [ -n "$out" ]; then
            echo "expected silence with no manifest, got: $out"; exit 1
          fi

          # 2. manifest, no phase running -> warn, still never a deny on Pre.
          printf '{"meta":{"version":2},"phases":[{"id":"P1","title":"p","status":"done","tasks":[{"id":"P1.1","title":"t","status":"done"}]}]}' \
            > "$proj/docs/audit/audit-plan.json"
          out=$(fire warn)
          if echo "$out" | grep -q 'permissionDecision'; then
            echo "warn tier must not emit a permissionDecision, got: $out"; exit 1
          fi

          # 3. manifest + a running phase -> the canonical deny JSON.
          printf '{"meta":{"version":2},"phases":[{"id":"P1","title":"p","status":"in_progress","tasks":[{"id":"P1.1","title":"t","status":"pending"}]}]}' \
            > "$proj/docs/audit/audit-plan.json"
          fire deny | grep -q '"permissionDecision": *"deny"'

          # 3b. ...and the same, SHARDED. The three cases above all use a
          # single-file manifest, which is the one layout that needs nothing from
          # scripts/ to read: the index of a sharded plan carries phase stubs with
          # no `status` at all, so a hook that fails to load scripts/_manifest_io
          # falls back to a plain read, sees no phase running, and goes SILENT on a
          # project whose gate should be denying. That is a wiring failure no
          # selftest can see (they call the loader directly) and no case here could
          # see either, because the layout it needs the module for ran nowhere.
          # Proven by breaking the delegation: deny becomes silence.
          mkdir -p "$proj/docs/audit/phases"
          printf '{"meta":{"version":2},"phases":[{"id":"P1","title":"p","shard":"phases/P1.json"}]}' \
            > "$proj/docs/audit/audit-plan.json"
          printf '{"id":"P1","title":"p","status":"in_progress","tasks":[{"id":"P1.1","title":"t","status":"pending"}]}' \
            > "$proj/docs/audit/phases/P1.json"
          fire sharded | grep -q '"permissionDecision": *"deny"' \
            || { echo "sharded manifest: expected deny, got silence — the assembled read is not reaching scripts/_manifest_io through the launcher"; exit 1; }

          # 4. enforce:true restores always-on deny with no manifest at all.
          rm -rf "$proj/docs"
          mkdir -p "$proj/.claude"
          printf '{"enforce":true}' > "$proj/.claude/audit.config.json"
          fire enforced | grep -q '"permissionDecision": *"deny"'
          echo "OK: observe / warn / deny / enforce all behave through the launcher"
      - name: Capability policy decides, end to end through the launcher
        shell: bash
        run: |
          set -e
          # Same reason as the step above: the selftests call decide() directly, so
          # nothing in them proves the launcher, the stdin contract, the matcher's
          # payload shape or the emitted JSON. A policy that resolves perfectly and
          # is never dispatched is exactly the failure this feature has to be honest
          # about, so its own wiring is checked rather than assumed.
          proj=$(mktemp -d)
          mkdir -p "$proj/.claude"

          cap() {
            printf '{"tool_name":"%s","tool_input":%s,"cwd":"%s","hook_event_name":"PreToolUse"}' \
              "$1" "$2" "$proj" \
              | env CLAUDE_PROJECT_DIR="$proj" sh plugins/audit/hooks/py-launch.sh \
                  guard-capabilities.py ask
          }

          # 1. no config -> the shipped policy is inert, so the hook says nothing.
          out=$(cap Skill '{"skill":"dataviz"}')
          if [ -n "$out" ]; then echo "expected silence when inert, got: $out"; exit 1; fi

          # 2. a real rule -> the canonical deny JSON, carrying its basis.
          printf '{"policy":{"skills":{"default":"deny","allow":["safe-*"]}}}' \
            > "$proj/.claude/audit.config.json"
          out=$(cap Skill '{"skill":"dataviz"}')
          echo "$out" | grep -q '"permissionDecision": *"deny"'
          echo "$out" | grep -q 'policy.skills.default is deny'

          # 3. ...and the allow list is what lets one through.
          out=$(cap Skill '{"skill":"safe-thing"}')
          if [ -n "$out" ]; then echo "an allowed skill must be silent, got: $out"; exit 1; fi

          # 4. audit's own components survive a policy that denies everything else.
          out=$(cap Skill '{"skill":"audit:next"}')
          if [ -n "$out" ]; then echo "audit's own must pass, got: $out"; exit 1; fi

          # 5. warn is a systemMessage and NEVER a permissionDecision - an advisory
          #    written as `allow` would bypass the permission system entirely.
          printf '{"policy":{"onViolation":"warn","mcp":{"deny":["mcp__prod-db__*"]}}}' \
            > "$proj/.claude/audit.config.json"
          out=$(cap mcp__prod-db__query '{}')
          echo "$out" | grep -q '"systemMessage"'
          if echo "$out" | grep -q 'permissionDecision'; then
            echo "warn must not emit a permissionDecision, got: $out"; exit 1
          fi
          echo "OK: inert / deny / allow / required / warn all behave through the launcher"

  manifests:
    name: manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Structural validator (the plugin's own) on starter + dogfood + example
        run: |
          python plugins/audit/scripts/manifest/validate-manifest.py plugins/audit/templates/audit-plan.starter.json
          python plugins/audit/scripts/manifest/validate-manifest.py docs/audit/audit-plan.json
          python plugins/audit/scripts/manifest/validate-manifest.py examples/acme-store/audit-plan.json
      - name: Sharded layout intact (index stubs + every shard assembles)
        run: |
          python - <<'PY'
          import json, os
          for idx in ("docs/audit/audit-plan.json", "examples/acme-store/audit-plan.json"):
              d = json.load(open(idx)); base = os.path.dirname(idx)
              assert d["meta"]["version"] == 3, idx + " is not sharded (meta.version != 3)"
              for p in d["phases"]:
                  assert "shard" in p, "%s: phase %s missing shard ref" % (idx, p.get("id"))
                  b = json.load(open(os.path.join(base, p["shard"])))
                  assert b.get("id") == p["id"] and "tasks" in b, "bad shard %s" % p["shard"]
              print("OK sharded:", idx, "-", len(d["phases"]), "shards")
          PY
      - name: Doctor reports this repo and the example as healthy
        shell: bash
        run: |
          set -e
          # An integration check the selftests cannot make: the doctor's value is
          # entirely in what it says about a REAL setup, and its first real run here
          # produced a false FINDING by reporting the shell keyword `for` as a
          # missing binary (this repo's own selftests gate is a `for` loop). Exit 0
          # means no findings; warnings are expected and fine.
          python plugins/audit/scripts/status/audit-doctor.py --project .
          python plugins/audit/scripts/status/audit-doctor.py --project examples/acme-store
          # --json stays parseable, since that is the form other tools would consume
          python plugins/audit/scripts/status/audit-doctor.py --project . --json \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["checks"]; \
              assert d["counts"]["FINDING"] == 0, d["counts"]; print("OK: doctor json clean")'
      - name: CI gate + report smoke on the dogfood manifest
        run: |
          python plugins/audit/scripts/status/audit-status.py docs/audit/audit-plan.json --gate
          python plugins/audit/scripts/report/render-report.py docs/audit/audit-plan.json --out-dir /tmp/audit-report
          test -s /tmp/audit-report/audit-report.html
          test -s /tmp/audit-report/audit-report.md
      - name: Committed rendered artifacts match their source
        shell: bash
        run: |
          set -e
          # The step BELOW renders the example to a temp directory and greps
          # that, which proves the renderer works and can never see the
          # COMMITTED file drift. It did: examples/acme-store kept the pre-F28
          # aria-labels -- the ones a speech user cannot reach -- long after the
          # source was fixed. This compares the file a user actually opens.
          python3 tools/check-rendered-artifacts.py
      - name: Example renders its Usage section (asserts content, not just a file)
        shell: bash
        run: |
          set -e
          CLAUDE_PROJECT_DIR=examples/acme-store \
            python plugins/audit/scripts/report/render-report.py \
              examples/acme-store/audit-plan.json --out-dir /tmp/acme
          grep -q 'id="usage"' /tmp/acme/acme-store-audit.html
          grep -q '## Usage' /tmp/acme/acme-store-audit.md
          echo "OK: example renders a Usage section from its committed ledger"
      - name: Committed example ledger is reproducible from the generator
        shell: bash
        run: |
          set -e
          python plugins/audit/scripts/demo/gen-demo-usage.py \
            examples/acme-store/audit-plan.json --out-dir /tmp/regen
          for f in examples/acme-store/.claude/usage/*.jsonl; do
            diff -q "$f" "/tmp/regen/$(basename "$f")"
          done
          echo "OK: committed ledger matches a fresh deterministic run"
      - name: Committed example still matches a FRESH render (not just its own copy)
        shell: bash
        run: |
          set -e
          # The cmp in the step below proves docs/index.html is a byte copy of the
          # example report. It does NOT prove either file still reflects the
          # renderer — so when render-report.py changes and nobody refreshes the
          # artifacts, both copies drift together and that gate stays green. That is
          # not hypothetical: a share-formatting fix landed, the committed example
          # kept showing the old value, and CI was green until a refactor happened to
          # render from a pristine `git archive HEAD` tree for unrelated reasons and
          # noticed. This step is the missing half — it re-renders and compares.
          #
          # --out-dir, not examples/report.sh, for one reason: report.sh renders IN
          # PLACE (and copies to docs/index.html), so running it here would overwrite
          # the very files being compared and the check could never fail. --out-dir is
          # report.sh's own documented scratch mode; everything else is identical to
          # what it runs — same script, same manifest, and CLAUDE_PROJECT_DIR pointed
          # at the example so the Usage section reads THAT project's committed ledger.
          # Verified faithful: a scratch render and the committed file differ in
          # exactly two places, both of them the wall-clock stamp.
          #
          # Which is the hard part. A naive cmp always fails, because the report
          # stamps `generated <UTC>` — the same reason the scale demo below is checked
          # by content and not by bytes. And the stamp appears TWICE: once in the
          # visible header, and once more inside the base64 Markdown twin embedded as
          # window.AUDIT_MD_B64. A normalizer that only rewrites the visible one still
          # reports a difference on every run forever, so the blob is decoded and
          # normalized inside. The counts are printed on every run, and a zero is a
          # failure rather than a quiet pass: if the twin's marker or the stamp format
          # moves, this says so instead of silently checking half the document.
          rm -rf /tmp/fresh-example && mkdir -p /tmp/fresh-example
          CLAUDE_PROJECT_DIR=examples/acme-store \
            python plugins/audit/scripts/report/render-report.py \
              examples/acme-store/audit-plan.json --out-dir /tmp/fresh-example
          python - <<'PYEOF'
          import base64, io, re, sys

          STAMP = re.compile(r"generated \d{4}-\d{2}-\d{2} \d{2}:\d{2} UTC")
          BLOB = re.compile(r'window\.AUDIT_MD_B64="([A-Za-z0-9+/=]*)"')
          PAIRS = [("examples/acme-store/acme-store-audit.html",
                    "/tmp/fresh-example/acme-store-audit.html"),
                   # The Markdown twin is committed too, is written by the same
                   # command, and drifts by the same mechanism - CI only ever grepped
                   # a fresh one for `## Usage`, never compared it to what shipped.
                   ("examples/acme-store/acme-store-audit.md",
                    "/tmp/fresh-example/acme-store-audit.md")]

          def normalize(path):
              """Stamp-free text, plus how many stamps were rewritten where.

              The embedded twin is spliced back DECODED rather than re-encoded, so a
              real difference inside it surfaces as readable Markdown instead of as
              an unreadable base64 run."""
              text = io.open(path, encoding="utf-8").read()
              inner = [0]

              def swap(m):
                  md = base64.b64decode(m.group(1)).decode("utf-8")
                  md, n = STAMP.subn("generated <STAMP>", md)
                  inner[0] += n
                  return "window.AUDIT_MD_B64=<decoded twin>\n" + md

              blobs = len(BLOB.findall(text))
              text = BLOB.sub(swap, text)
              text, visible = STAMP.subn("generated <STAMP>", text)
              return text, visible, blobs, inner[0]

          bad = 0
          for committed, fresh in PAIRS:
              a, a_vis, a_blobs, a_inner = normalize(committed)
              b, b_vis, b_blobs, b_inner = normalize(fresh)
              if not a_vis or not b_vis:
                  sys.exit("FAIL: no `generated <UTC>` stamp found in %s - the stamp "
                           "format moved and this check normalizes nothing" % committed)
              if committed.endswith(".html"):
                  if a_blobs != 1 or b_blobs != 1:
                      sys.exit("FAIL: expected exactly one window.AUDIT_MD_B64 blob in "
                               "%s, found %d - the embedded Markdown twin moved and its "
                               "stamp is no longer being normalized" % (committed, a_blobs))
                  if not a_inner or not b_inner:
                      sys.exit("FAIL: the embedded twin in %s carries no `generated "
                               "<UTC>` stamp - decoding it reached nothing" % committed)
              print("normalized %s: %d visible + %d embedded stamp(s)"
                    % (committed, a_vis, a_inner))
              if a == b:
                  continue
              bad += 1
              i = 0
              while i < min(len(a), len(b)) and a[i] == b[i]:
                  i += 1
              print("FAIL: %s no longer matches a fresh render" % committed)
              print("  first difference at char %d (stamps already normalized)" % i)
              print("  committed: %r" % a[max(0, i - 60):i + 60])
              print("  fresh:     %r" % b[max(0, i - 60):i + 60])
          if bad:
              sys.exit("fix: run `examples/report.sh` and commit what it rewrites\n"
                       "     (examples/acme-store/acme-store-audit.{html,md} and "
                       "docs/index.html)")
          print("OK: the committed example report and its Markdown twin are what "
                "today's renderer produces")
          PYEOF
      - name: Live demo is the committed example (docs/index.html has not drifted)
        shell: bash
        run: |
          set -e
          # docs/index.html is the GitHub Pages demo and the target of the README's
          # "See it" link. It is a byte copy of the committed example report, so the
          # check is a plain cmp: no timestamp normalizing, no re-render. The step
          # above already proves the example itself renders correctly from its
          # manifest, so the two together mean the published demo is current.
          #
          # It drifted for two releases (a month stale, no Usage section at all)
          # because a release could re-render the example and forget the copy. Now it
          # cannot: refresh with
          #   cp examples/acme-store/acme-store-audit.html docs/index.html
          if ! cmp -s docs/index.html examples/acme-store/acme-store-audit.html; then
            echo "docs/index.html has drifted from examples/acme-store/acme-store-audit.html"
            echo "fix: cp examples/acme-store/acme-store-audit.html docs/index.html"
            exit 1
          fi
          grep -q 'id="usage"' docs/index.html
          echo "OK: the live demo is the committed example, Usage section included"
      - name: Scale demo is renderable and valid (docs/demo-large.html)
        shell: bash
        run: |
          set -e
          # The scale demo used to be unreproducible — its 40x5 manifest was never
          # committed — and it had been serving a report rendered from an INVALID
          # manifest, so the hosted page carried a red "INVALID MANIFEST: 10 finding(s)"
          # banner. gen-demo-manifest.py rebuilds the fixture deterministically, so the
          # page is now checked the same way the example is.
          #
          # Content assertions, not a byte diff: the render stamps a wall-clock time,
          # so a fresh render always differs by that line. Refresh with
          #   python plugins/audit/scripts/demo/gen-demo-manifest.py /tmp/dl --phases 40 --tasks 5
          #   python plugins/audit/scripts/demo/gen-demo-usage.py /tmp/dl/audit-plan.json
          #   CLAUDE_PROJECT_DIR=/tmp/dl python plugins/audit/scripts/report/render-report.py \
          #     /tmp/dl/audit-plan.json --out-dir /tmp/dl --format html
          #   cp /tmp/dl/demo-large.html docs/demo-large.html
          python plugins/audit/scripts/demo/gen-demo-manifest.py /tmp/dl --phases 40 --tasks 5
          python plugins/audit/scripts/manifest/validate-manifest.py /tmp/dl/audit-plan.json
          # F-A-1 (v0.37): these probes used to grep the WHOLE document, embedded
          # report.js included - the same blindness render-report's selftest pins
          # carried (F-C-1, v0.36). Judged over the markup with <script> blocks
          # stripped, a JS string containing a markup literal can no longer move
          # a count or trip the invalid-banner probe.
          python - <<PYEOF
          import io, re, sys
          s = io.open("docs/demo-large.html", encoding="utf-8").read()
          m = re.sub(r"(?is)<script\b.*?</script\s*>", "", s)
          if "INVALID MANIFEST" in m:
              sys.exit("docs/demo-large.html was rendered from an invalid manifest")
          if 'id="usage"' not in m:
              sys.exit("no Usage section in the markup")
          n = m.count('tr class="phase"')
          if n != 40:
              sys.exit("expected 40 phase rows in the markup, got %d" % n)
          print("OK: scale demo renders 40 valid phases with a Usage section")
          PYEOF
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: ui/ JavaScript unit tests (cross-checked against _fmt.py)
        shell: bash
        run: |
          set -e
          # The ONLY layer that reads ui/*.js as BEHAVIOUR. Everything else is a
          # substring pin (which reads text) or a browser drive (which needs the
          # whole artifact), and neither can call a function with an argument.
          # 6,375 lines of JavaScript had no unit test at all until this, which is
          # how two live defects survived: uTok rounded where _fmt.py truncates,
          # and every toFixed broke an exact tie away from zero where Python's
          # "%.*f" breaks it to even. Both files carried a comment claiming to
          # mirror the Python; one of them was false.
          #
          # The formatters are compared against plugins/audit/scripts/_fmt.py in
          # the same run - that cross-language comparison is what would have
          # caught uTok on the day it was written, and it is why this step needs
          # Python and Node together rather than a Node-only job.
          #
          # `node --check` per part catches the other class: a syntax error kills
          # the entire inline <script> while every substring pin stays green. Parsing a
          # part alone is a sloppy-script parse, so it is the assembled-body
          # parse in the Node suite that matches the shipped module dialect;
          # this loop catches the per-file half.
          npm ci
          npx vitest run
          # find, not a glob: both scripts now live in feature directories, so
          # `ui/*.js` matches NOTHING — a syntax check that exits 0 having parsed
          # none of the tree. It used to match panel.js alone and grade a tenth of
          # the tree as clean; when the last flat file left, the hazard went total.
          n=0
          for f in $(find plugins/audit/scripts/ui -name '*.js' | sort); do
            node --check "$f" || { echo "FAIL: $f is not parseable"; exit 1; }
            n=$((n+1))
          done
          if [ "$n" -lt 2 ]; then
            echo "FAIL: only $n ui asset(s) parsed - the walk is not reaching them"
            exit 1
          fi
          echo "OK: $n ui asset(s) parse"
      - name: Demo GIF still shows what it claims (the gate still refuses)
        shell: bash
        run: |
          set -e
          # The README's headline image is a recording of the plan gate denying an
          # edit. Nothing in CI can tell that a committed GIF has gone stale — it is
          # just bytes — so this asserts the BEHAVIOUR the recording depends on:
          # the in-plan edit allowed, the out-of-plan edit denied, and the refusal
          # still naming the file and the way out. If the gate's wording moves, this
          # fails and the GIF gets re-recorded, rather than shipping a picture of
          # something the product no longer does. --check writes no file and needs
          # no font.
          python tools/capture-demo-gif.py --check

      - name: Screenshot preconditions (the report actually paints what it claims)
        shell: bash
        run: |
          set -e
          # Gates the artifact, not the stylesheet. Every committed README screenshot
          # showed an empty progress bar — including a phase at 2/2 — because the fill
          # is a <span> with no `display`, and an inline box ignores width. A Python
          # selftest can assert the CSS says `display:block`; only a browser can prove
          # the bar paints. --check writes no PNGs.
          #
          # Pixels are deliberately NOT compared against the committed files: font
          # rasterisation differs between macOS and CI Linux, so a byte diff would
          # fail for reasons unrelated to the product. Refresh the images locally with
          #   node tools/capture-screenshots.mjs
          # playwright is a devDependency and `npm ci` above already installed it
          # from the lockfile. The ad-hoc `npm install --no-save --no-package-lock`
          # that stood here predates package.json; once one existed, the two ways
          # of populating node_modules started fighting. `--omit=dev` was added to
          # stop the second install pulling vitest in, and that combination -
          # a tree `npm ci` filled WITH dev deps, then an install asked to exclude
          # them - crashed npm's arborist with `Cannot read properties of null
          # (reading 'edgesOut')`. NON-DETERMINISTICALLY: identical inputs passed on
          # 4763dd7 and failed on fdf60a2, which is the worst kind of red.
          # One manifest, one install, one pin. Only the browser binaries are
          # fetched here, because those do not live in node_modules.
          npx playwright install --with-deps chromium
          node tools/capture-screenshots.mjs --check

      - name: The report is interactive, not just well-formed
        shell: bash
        run: |
          set -e
          # Everything else about the report is checked by grepping the output for
          # markers. A JavaScript error that kills every event handler leaves every
          # one of those markers intact — so the report can ship completely inert
          # with this workflow green, and the interactive layer is roughly a third of
          # render-report.py. This drives the real file in a real browser: click a
          # phase title, expand all, type in the filter, press Escape, click a status
          # chip, and assert the visible row counts actually change.
          #
          # Opened over file://, because that is how a report gets shared. Proven to
          # fail, not just to pass: a TypeError injected into the script and a filter
          # stubbed to match everything both exit 1, while `grep id="usage"` passes
          # on both.
          #
          # Chromium is already installed by the screenshot step above.
          #
          # Every shipped report, not just one. docs/index.html is the live demo —
          # the first thing anyone who has not installed the plugin ever sees — and
          # demo-large.html is the 40-phase scale demo, where the interactive layer
          # matters most and is least likely to be opened by hand before a release.
          for f in examples/acme-store/acme-store-audit.html \
                   docs/index.html \
                   docs/demo-large.html; do
            node tools/check-report-interactive.mjs "$f"
          done
          # ...and one report none of those three can stand in for: a plan whose
          # phases ALL share one status. All three above have a mix, so the checker's
          # one-status path ran nowhere in CI — and it was wrong. It asserted that
          # clicking a status chip drops rows, which is false by construction when
          # every phase carries that status, so the tool printed REPORT IS INERT and
          # exited 1 against a working report on what is simply the normal END STATE
          # of a plan: everything done. This repo's own manifest is exactly that, so
          # the case now has a permanent fixture rather than being rediscovered by
          # whoever next finishes a plan and runs the tool on it.
          rm -rf /tmp/one-status && mkdir -p /tmp/one-status
          python plugins/audit/scripts/report/render-report.py docs/audit/audit-plan.json \
            --out-dir /tmp/one-status --format html
          node tools/check-report-interactive.mjs /tmp/one-status/*.html
          # ...and one none of them can stand in for: an ALL-PARKED plan. That is
          # what /audit:init leaves when the user declines every synthesized
          # phase, and it used to render zero phases with no hint that any
          # proposal existed (F-P-32) — a report showing nothing does not read as
          # "the proposals are elsewhere", it reads as "there is nothing", on the
          # one surface a team is likely to be shown. Without this fixture the
          # check for that sentence is an implication nothing ever makes true.
          # Built the way /audit:init's "Park all as proposals" actually leaves a
          # manifest: meta + phases[] + fileIndex{}, every proposal back to
          # `proposed`, and no bugs — a bug whose taskId lives only inside a parked
          # payload is a dangling ref, and emptying phases while leaving a
          # materialized proposal points materializedAs at a phase that is gone.
          # Both were findings on the first attempt at this fixture.
          rm -rf /tmp/all-parked && mkdir -p /tmp/all-parked
          python - <<'PYEOF'
          import io, json
          src = json.load(io.open("/tmp/dl/audit-plan.json", encoding="utf-8"))
          src["phases"] = []
          src["fileIndex"] = {}
          src["bugs"] = []
          for prop in src.get("proposals") or []:
              prop["status"] = "proposed"
              prop["materializedAs"] = None
              prop["materializedAt"] = None
              prop.pop("notes", None)
              prop.pop("droppedAt", None)
          io.open("/tmp/all-parked/audit-plan.json", "w", encoding="utf-8").write(
              json.dumps(src, indent=2))
          PYEOF
          python plugins/audit/scripts/manifest/validate-manifest.py \
            /tmp/all-parked/audit-plan.json
          CLAUDE_PROJECT_DIR=/tmp/all-parked python \
            plugins/audit/scripts/report/render-report.py \
            /tmp/all-parked/audit-plan.json --out-dir /tmp/all-parked --format html
          # NOT check-report-interactive here: a document with no plan has none of
          # the elements that tool drives, so it exits 2 ("cannot check") — which is
          # its correct answer, not a gap. What this fixture exists to prove is the
          # SENTENCE, and that is a grep.
          grep -q "parked proposal" /tmp/all-parked/*.html \
            || { echo "an all-parked report does not name its proposals"; exit 1; }
          # ...and --no-proposals drops the SECTION without dropping that sentence.
          CLAUDE_PROJECT_DIR=/tmp/all-parked python \
            plugins/audit/scripts/report/render-report.py \
            /tmp/all-parked/audit-plan.json --out-dir /tmp/all-parked \
            --format html --basename np --no-proposals
          grep -q "parked proposal" /tmp/all-parked/np.html \
            || { echo "--no-proposals swallowed the empty-plan sentence"; exit 1; }
          if grep -q 'id="proposals"' /tmp/all-parked/np.html; then
            echo "--no-proposals did not drop the section"; exit 1
          fi

          # ...and one document none of the four above can stand in for either: a
          # report OLDER than the checks. Every artifact CI renders is by
          # definition current, so the path that meets a missing element ran
          # nowhere — and it met one by dereferencing it, dying inside
          # page.evaluate with `Cannot read properties of null` and a stack ending
          # in the checker (F7). A diagnostic that dies computing its own
          # diagnosis reports the wrong thing twice, and the first reader of an
          # older report believes the report is broken. Faked here by taking the
          # class off the fresh render's filter bar, which is what a report
          # predating .sectools looks like to a selector.
          sed 's/class="toolbar sectools"/class="toolbar was-sectools"/' \
            /tmp/one-status/audit-report.html > /tmp/one-status/aged.html
          set +e
          node tools/check-report-interactive.mjs /tmp/one-status/aged.html > /tmp/aged.log 2>&1
          aged=$?
          set -e
          cat /tmp/aged.log
          # Exit 2 is the assertion — "could not run", NOT exit 1 "the report is
          # inert", which is the accusation this fault made. The grep is the
          # second half and not the verdict: exit 2 alone is also what a missing
          # browser produces, so the element has to be named too.
          test "$aged" -eq 2 || { echo "expected exit 2 (cannot check), got $aged"; exit 1; }
          grep -q 'no \.sectools' /tmp/aged.log \
            || { echo 'expected the missing element to be named'; exit 1; }
      - name: JSON Schema validation (ajv, draft 2020-12)
        run: |
          npx --yes ajv-cli validate --spec=draft2020 \
            -s plugins/audit/schema/audit-plan.schema.json \
            -d plugins/audit/templates/audit-plan.starter.json
          npx --yes ajv-cli validate --spec=draft2020 \
            -s plugins/audit/schema/audit-plan.schema.json \
            -d docs/audit/audit-plan.json
          npx --yes ajv-cli validate --spec=draft2020 \
            -s plugins/audit/schema/audit-plan.schema.json \
            -d examples/acme-store/audit-plan.json

  lint:
    name: lint (ruff + vermin 3.8 floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned lint tools (dev/CI-only, not a runtime dependency)
        run: pip install ruff==0.16.2 vermin==1.8.0
      - name: ruff (E9+F, py38 target from pyproject.toml)
        run: ruff check plugins/audit tools
      - name: vermin holds the 3.8 floor
        run: |
          # -t=3.8- carries the trailing dash on purpose: it means "3.8 or lower",
          # i.e. "detected floor must not exceed 3.8". A bare -t=3.8 instead demands
          # the detected floor EQUAL 3.8 — this tree's detected floor is 3.7, so the
          # bare flag fails on code that is already fully compatible.
          vermin -t=3.8- --no-tips --violations plugins/audit/scripts plugins/audit/hooks

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace + plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate plugins/audit
