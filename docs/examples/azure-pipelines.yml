# Azure Pipelines example — gate a build on the audit manifest's state and
# publish the audit report as a build artifact.
#
# The scripts (validate-manifest.py, audit-status.py, render-report.py,
# run-test-gate.py) are not standalone files: each is an entry point with sibling
# modules and, for the report, ui/ assets. So the first step clones the plugin
# repository at a PINNED release tag and every later step calls the scripts from
# that clone. Bump the tag deliberately; `tools/check-example-pins.py` asks the
# tag's tree whether every script this file calls exists there. (Or vendor the
# whole plugins/audit/scripts/ directory into your repo and skip the clone.)
#
# Optional: /audit:sync works headless here too — provide a PAT via the
# AZURE_DEVOPS_EXT_PAT secret variable (az devops reads it; never echo it).

trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  manifest: docs/audit/audit-plan.json

steps:
  # `fetchDepth: 0` — a FULL clone. Ancestry is what tells a `whole` full run apart
  # from an `unknown` one, and a shallow clone answers `unknown` for every phase
  # regardless of what actually ran, because git has no history to walk. The
  # `unknown-full-run` condition in the last step is the one that fails on that
  # answer; `stale-full-run` never counts an `unknown` phase.
  - checkout: self
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'

  - script: |
      set -e
      git clone --depth 1 --branch v3.4.0 \
        https://github.com/AleksandarBisevac/claude-plugins.git \
        "$(Agent.TempDirectory)/plugin-src"
    displayName: Fetch the audit plugin's scripts/ tree (pinned tag)

  - script: python "$(Agent.TempDirectory)/plugin-src/plugins/audit/scripts/manifest/validate-manifest.py" "$(manifest)"
    displayName: Validate audit manifest (structure, links, cycles)

  - script: |
      python "$(Agent.TempDirectory)/plugin-src/plugins/audit/scripts/status/audit-status.py" "$(manifest)" --gate
    displayName: 'Gate: manifest valid, no open high-severity bugs, no blocked tasks'
    # tune with e.g.  --fail-on invalid,open-bugs,in-progress  for a release freeze

  - script: |
      python "$(Agent.TempDirectory)/plugin-src/plugins/audit/scripts/report/render-report.py" "$(manifest)" \
        --out-dir "$(Build.ArtifactStagingDirectory)"
    displayName: Render audit report
    condition: succeededOrFailed()

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: $(Build.ArtifactStagingDirectory)
      artifactName: audit-report
    displayName: Publish audit report
    condition: succeededOrFailed()

  # --- the third place: meta.fullGate, measured against the whole checkout -------
  # `run-test-gate.py --full` needs its sibling modules (`_evidence_io`, `_manifest_io`,
  # `_loader`, ...), which the clone above already carries.

  - script: |
      python "$(Agent.TempDirectory)/plugin-src/plugins/audit/scripts/governance/run-test-gate.py" \
        "$(manifest)" --full --record --writer "ci-$(Build.BuildId)"
    displayName: 'Third place: meta.fullGate, --full --record --writer'
    # a build's identity must not be split by session id - see README "The third place"
    # This step RECORDS and learns nothing: it calls run-test-gate.py, not
    # full-gate.py, because a coupling or a bug filed here would be filed into
    # a checkout this build throws away. Learning from a red run happens in the
    # clone that imports the shard below.

  # The evidence directory is published so a maintainer can bring the row this
  # runner recorded back into a clone with `import-evidence.py <manifest>
  # <shard.jsonl>` - the shard's own chain verifies before anything is copied, so
  # a hand-downloaded artifact is trusted the same way a `git`-carried file would be.
  # For each imported row that is a red full run, the import prints
  # `python3 <plugin>/scripts/governance/full-gate.py <manifest> --learn-from
  # <runId> --project-dir <dir>`, every path absolute, and runs nothing; the
  # maintainer runs that line as printed in the clone, which is where the
  # coupling and the bug it files are kept.
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: docs/audit/evidence
      artifactName: audit-evidence
    displayName: Publish the evidence directory
    condition: succeededOrFailed()

  - script: |
      python "$(Agent.TempDirectory)/plugin-src/plugins/audit/scripts/status/audit-status.py" \
        "$(manifest)" --gate --fail-on stale-full-run,unknown-full-run
    displayName: 'Gate: no merged phase is stale behind a full run, and none is unknown'
    # stale-full-run: a full run recorded after the phase merged still does not
    # contain it. unknown-full-run: the question could not be asked - no mergedHead,
    # a shallow clone git cannot walk, or an unreadable ledger.
    condition: succeededOrFailed()
